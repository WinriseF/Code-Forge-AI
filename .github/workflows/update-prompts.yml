name: Update Prompt Library

on:
  schedule:
    - cron: '0 0 * * 1' # 每周一国际标准时间 0点 运行
  workflow_dispatch:    # 允许手动触发

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      # 2. 拉取 tldr 官方数据
      - name: Checkout Official Tldr Data
        uses: actions/checkout@v4
        with:
          repository: tldr-pages/tldr
          path: build/tldr
          sparse-checkout: |
            pages
            pages.zh
          fetch-depth: 1

      # 3. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 4. 安装依赖 (Prompt 脚本需要 requests)
      - name: Install Dependencies
        run: pip install requests

      # 5. 运行 TLDR 构建脚本 (生成 commands-*.json 和 manifest_tldr_partial.json)
      - name: Build Commands (Tldr)
        run: python build/build_tldr.py

      # 6. 运行 Prompt 构建脚本 (生成 prompts-*.json 和 manifest_prompts_partial.json)
      - name: Build Prompts (Roles)
        run: python build/build_prompts.py

      # 7. ✨ 核心步骤：合并清单 (Merge Manifests)
      # 这段 Python 脚本会扫描所有 *_partial.json 并合并为最终的 manifest.json
      - name: Merge Manifests
        run: |
          python -c "
          import json
          import os
          import time

          dist_dir = 'build/dist'
          packs_dir = os.path.join(dist_dir, 'packs')
          all_packages = []
          recorded_urls = set()

          # 加载自定义包元数据覆盖
          meta_path = os.path.join('build', 'packs_meta.json')
          packs_meta = {}
          if os.path.exists(meta_path):
              with open(meta_path, 'r', encoding='utf-8') as f:
                  packs_meta = json.load(f)
              print(f'  📋 Loaded {len(packs_meta)} pack metadata overrides.')

          print('🔄 Merging manifests and scanning directory structure...')

          # 1. 加载官方脚本生成的 partial json
          if os.path.exists(dist_dir):
              for f in os.listdir(dist_dir):
                  if f.endswith('_partial.json'):
                      path = os.path.join(dist_dir, f)
                      try:
                          with open(path, 'r', encoding='utf-8') as fp:
                              data = json.load(fp)
                              if isinstance(data, list):
                                  all_packages.extend(data)
                                  for item in data:
                                      recorded_urls.add(item.get('url'))
                                  print(f'  ➕ Added {len(data)} official packs from {f}')
                          os.remove(path)
                      except Exception as e:
                          print(f'  ❌ Error reading {f}: {e}')

          # 2. 智能扫描 packs 文件夹结构
          if os.path.exists(packs_dir):
              for root, dirs, files in os.walk(packs_dir):
                  for filename in files:
                      if not filename.endswith('.json'):
                          continue

                      full_path = os.path.join(root, filename)
                      # 这里的 rel_path 是 manifest 里的下载地址，保持不变
                      rel_path = os.path.relpath(full_path, dist_dir).replace('\\\\', '/')

                      if rel_path in recorded_urls:
                          continue

                      # === 📂 路径解析逻辑 ===
                      # rel_from_packs 例如: 'prompts/zh/中文角色扮演精选.json'
                      rel_from_packs = os.path.relpath(full_path, packs_dir).replace('\\\\', '/')
                      path_parts = rel_from_packs.split('/')

                      # 默认值
                      category = 'prompt'
                      lang = 'en'

                      # 根据文件夹层级推断
                      if len(path_parts) >= 2:
                          # 第一层: prompts 或 commands
                          folder_type = path_parts[0].lower()
                          if 'command' in folder_type:
                              category = 'command'
                          elif 'prompt' in folder_type:
                              category = 'prompt'

                          # 第二层: en 或 zh
                          folder_lang = path_parts[1].lower()
                          if 'zh' in folder_lang:
                              lang = 'zh'
                          elif 'en' in folder_lang:
                              lang = 'en'

                      try:
                          with open(full_path, 'r', encoding='utf-8') as fp:
                              content = json.load(fp)

                          if not isinstance(content, list):
                              print(f'  ⚠️ Skipping {rel_path}: Root must be a list.')
                              continue

                          # === 🏷️ 命名与ID逻辑 (更新点) ===

                          # 1. 名字直接用文件名 (去掉后缀)
                          # 比如 '中文角色扮演精选.json' -> '中文角色扮演精选'
                          file_pure_name = os.path.splitext(filename)[0]

                          # 2. 生成唯一 ID
                          # 为了防止不同文件夹下有同名文件冲突，ID 加上前缀
                          # 比如 'custom-prompt-zh-中文角色扮演精选'
                          safe_id = f'custom-{category}-{lang}-{file_pure_name}'

                          meta_override = packs_meta.get(rel_path, {})

                          new_pack = {
                              'id': safe_id,
                              'language': lang,
                              'platform': 'custom',
                              'name': meta_override.get('name', file_pure_name),
                              'description': meta_override.get('description', file_pure_name),
                              'count': len(content),
                              'size_kb': round(os.path.getsize(full_path) / 1024, 2),
                              'url': rel_path,
                              'category': category
                          }

                          all_packages.append(new_pack)
                          display_name = new_pack['name']
                          if meta_override:
                              print(f'  🏷️ Override: {filename} -> Name: \"{display_name}\"')
                          else:
                              print(f'  🕵️ Auto-detected: {filename} -> Name: \"{display_name}\"')

                      except Exception as e:
                          print(f'  ❌ Error processing {filename}: {e}')

          # 3. 生成最终 Manifest
          final_manifest = {
              'updated_at': int(time.time() * 1000),
              'version': '2.1.0',
              'packages': all_packages
          }

          with open(os.path.join(dist_dir, 'manifest.json'), 'w', encoding='utf-8') as f:
              json.dump(final_manifest, f, indent=2, ensure_ascii=False)

          print(f'✅ Final manifest created with {len(all_packages)} total packages.')
          "

      # 8. 提交结果到 GitHub
      - name: Commit and Push to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 强制添加 dist 目录 (即使被 gitignore)
          git add -f build/dist
          
          if git diff --staged --quiet; then
            echo "✅ GitHub: 数据没有变化。"
          else
            git commit -m "chore(data): auto-update prompts library [skip ci]"
            git push origin main
            echo "🚀 GitHub: 数据已更新！"
          fi

      # 9. 同步到 Gitee (保持原样，纯净同步 build 和 models)
      - name: Sync Only build & models to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "❌ Error: GITEE_TOKEN is not set."
            exit 1
          fi

          echo "📥 Cloning Gitee repo..."
          git clone https://oauth2:${GITEE_TOKEN}@gitee.com/winriseF/models.git gitee_workspace

          echo "🧹 Cleaning Gitee workspace..."
          cd gitee_workspace
          git rm -rf . --ignore-unmatch
          git clean -fdx
          cd ..

          echo "Dg Copying specific folders..."
          mkdir -p gitee_workspace/build
          cp -r build/* gitee_workspace/build/
          
          mkdir -p gitee_workspace/models
          cp -r models/* gitee_workspace/models/
          
          echo "📄 Copying documentation files..."
          for file in README.md README.zh-CN.md USAGE.md USAGE_EN.md; do
            if [ -f "$file" ]; then
              cp "$file" gitee_workspace/
            fi
          done

          cd gitee_workspace
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git add .

          if git diff --staged --quiet; then
            echo "✅ Gitee: 内容一致，无需推送。"
          else
            echo "📦 Pushing clean state to Gitee..."
            git commit -m "chore(sync): sync build and models only [skip ci]"
            git push https://oauth2:${GITEE_TOKEN}@gitee.com/winriseF/models.git master
            echo "🚀 Gitee: 同步成功！"
          fi