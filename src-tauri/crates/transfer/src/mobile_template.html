<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=0" />
  <title>CtxRun Transfer</title>
  <style>
    /* 自动适配白天/黑夜模式的极简配色系统 */
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --danger: #dc2626;
      --primary: #2563eb;
      --primary-fg: #ffffff;
      --bubble-in: #ffffff;
      --bubble-out: #2563eb;
      --bubble-out-text: #ffffff;
      --scrollbar-track: rgba(17, 24, 39, 0.06);
      --scrollbar-thumb: rgba(107, 114, 128, 0.36);
      --scrollbar-thumb-hover: rgba(75, 85, 99, 0.52);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f111a;
        --surface: #1e2230;
        --border: #2a2f40;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --primary: #3b82f6;
        --bubble-in: #1e2230;
        --danger: #f87171;
        --scrollbar-track: rgba(255, 255, 255, 0.04);
        --scrollbar-thumb: rgba(148, 163, 184, 0.38);
        --scrollbar-thumb-hover: rgba(148, 163, 184, 0.58);
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); overflow: hidden;
    }

    .app { display: flex; flex-direction: column; height: 100%; }

    /* 顶部导航栏 */
    header {
      flex-shrink: 0; height: 50px; background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 16px; padding-top: env(safe-area-inset-top);
      z-index: 10;
    }
    .header-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
    .status-dot.ready { background: #10b981; }

    /* 消息区域 */
    main {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }
    main::-webkit-scrollbar,
    .input-box::-webkit-scrollbar {
      width: 10px;
    }
    main::-webkit-scrollbar-track,
    .input-box::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
      border-radius: 999px;
    }
    main::-webkit-scrollbar-thumb,
    .input-box::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--scrollbar-thumb), color-mix(in srgb, var(--scrollbar-thumb) 78%, transparent));
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: padding-box;
      min-height: 48px;
    }
    main::-webkit-scrollbar-thumb:hover,
    .input-box::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--scrollbar-thumb-hover), color-mix(in srgb, var(--scrollbar-thumb-hover) 78%, transparent));
      background-clip: padding-box;
    }
    .system-msg {
      align-self: center; font-size: 11px; color: var(--muted); background: var(--border); padding: 4px 12px; border-radius: 12px;
    }
    .bubble-wrapper { display: flex; flex-direction: column; width: 100%; }
    .bubble-wrapper.out { align-items: flex-end; }
    .bubble-wrapper.in { align-items: flex-start; }
    
    .bubble {
      max-width: 80%; padding: 10px 14px; font-size: 15px; line-height: 1.5; word-wrap: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .bubble.in { background: var(--bubble-in); color: var(--text); border-radius: 16px 16px 16px 4px; border: 1px solid var(--border); }
    .bubble.out { background: var(--bubble-out); color: var(--bubble-out-text); border-radius: 16px 16px 4px 16px; }
    .time { font-size: 10px; color: var(--muted); margin-top: 4px; margin-bottom: 4px; }
    .bubble-meta {
      display: flex; align-items: center; gap: 8px; margin-top: 4px;
    }
    .bubble-wrapper.out .bubble-meta { justify-content: flex-end; }
    .bubble-wrapper.in .bubble-meta { justify-content: flex-start; }
    .copy-btn {
      border: 1px solid color-mix(in srgb, var(--border) 75%, transparent);
      background: color-mix(in srgb, var(--surface) 82%, transparent);
      color: var(--muted);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 10px;
      line-height: 1;
      font-weight: 600;
    }
    .copy-btn:active {
      transform: scale(0.98);
    }

    /* 文件卡片 */
    .file-card { display: flex; flex-direction: column; gap: 8px; min-width: 160px; }
    .file-name { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta { font-size: 12px; opacity: 0.8; }
    .file-dl { margin-top: 4px; padding: 6px 0; background: rgba(255,255,255,0.2); text-align: center; border-radius: 8px; color: inherit; text-decoration: none; font-size: 13px; }
    progress { width: 100%; height: 4px; appearance: none; border: none; border-radius: 2px; overflow: hidden; }
    progress::-webkit-progress-bar { background: rgba(0,0,0,0.2); }
    progress::-webkit-progress-value { background: #fff; }

    /* 底部输入区 */
    footer {
      flex-shrink: 0; background: var(--surface); border-top: 1px solid var(--border);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      display: flex; align-items: flex-end; gap: 10px;
    }
    .btn-icon {
      width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent; color: var(--muted);
      font-size: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-icon:hover,
    .btn-icon:active { background: color-mix(in srgb, var(--border) 65%, transparent); }
    .input-box {
      flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 20px;
      padding: 8px 14px; font-size: 15px; color: var(--text); resize: none; max-height: 100px;
      outline: none; overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) transparent;
    }
    .btn-send {
      width: 64px; height: 36px; border-radius: 18px; border: none; background: var(--primary); color: white;
      font-size: 14px; font-weight: 600; flex-shrink: 0; transition: opacity 0.2s;
    }
    .btn-send:disabled { opacity: 0.5; }

    /* 鉴权遮罩 */
    #approvalGate {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .approval-card { background: var(--surface); padding: 24px; border-radius: 16px; width: 100%; max-width: 320px; text-align: center; }
    .approval-card .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .approval-card .retry-btn { margin-top: 16px; padding: 10px 20px; border-radius: 8px; background: var(--primary); color: white; border: none; font-size: 14px; font-weight: 600; }
    #mediaSheet {
      position: fixed; inset: 0; z-index: 90; display: flex; align-items: flex-end; justify-content: center;
      padding: 16px 12px calc(16px + env(safe-area-inset-bottom)); background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
    }
    .media-sheet-card {
      width: 100%; max-width: 420px; background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid color-mix(in srgb, var(--border) 85%, transparent);
      border-radius: 22px; box-shadow: 0 16px 48px rgba(0,0,0,0.18); overflow: hidden;
    }
    .media-sheet-header {
      padding: 14px 16px 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--muted);
    }
    .media-sheet-actions {
      display: flex; flex-direction: column; gap: 8px; padding: 0 10px 10px;
    }
    .media-action {
      width: 100%; border: 1px solid var(--border); border-radius: 16px; background: var(--bg);
      color: var(--text); padding: 14px 16px; font-size: 15px; font-weight: 600;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .media-action small {
      color: var(--muted); font-size: 12px; font-weight: 500;
    }
    .media-action:active {
      transform: scale(0.99);
    }
    .media-sheet-cancel {
      width: calc(100% - 20px); margin: 0 10px 10px; border: none; border-radius: 16px;
      background: var(--primary); color: var(--primary-fg); padding: 13px 16px; font-size: 15px; font-weight: 700;
    }
    #copyToast {
      position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9); color: #fff; border-radius: 999px; padding: 9px 14px;
      font-size: 12px; font-weight: 600; z-index: 120; pointer-events: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="header-title">
        <span id="statusDot" class="status-dot"></span>
        <span id="headerText">CtxRun Transfer</span>
      </div>
    </header>

    <main id="messages">
       <div id="initialSystemMessage" class="system-msg"></div>
    </main>

    <footer>
      <button class="btn-icon" id="attachBtn" aria-label="Attach File">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <button class="btn-icon" id="cameraBtn" aria-label="Camera">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <textarea class="input-box" id="composerInput" rows="1" placeholder="Message..."></textarea>
      <button class="btn-send" id="sendBtn" disabled>Send</button>
      <input id="fileInput" class="hidden" type="file" multiple />
      <input id="photoInput" class="hidden" type="file" accept="image/*" capture="environment" />
      <input id="videoInput" class="hidden" type="file" accept="video/*" capture="environment" />
    </footer>
  </div>

  <div id="mediaSheet" class="hidden">
    <div class="media-sheet-card" role="dialog" aria-modal="true">
      <div id="mediaSheetHeader" class="media-sheet-header">Camera</div>
      <div class="media-sheet-actions">
        <button id="takePhotoBtn" class="media-action" type="button">
          <span id="takePhotoText">Take Photo</span>
          <small id="takePhotoHint">Open native camera</small>
        </button>
        <button id="recordVideoBtn" class="media-action" type="button">
          <span id="recordVideoText">Record Video</span>
          <small id="recordVideoHint">Capture and send a clip</small>
        </button>
      </div>
      <button id="mediaSheetCancel" class="media-sheet-cancel" type="button">Cancel</button>
    </div>
  </div>

  <div id="copyToast" class="hidden"></div>

  <div id="approvalGate" class="hidden">
    <div class="approval-card">
      <div class="spinner"></div>
      <h2 id="approvalTitle" style="margin:0 0 8px; font-size: 20px;"></h2>
      <p id="approvalDesc" style="margin:0; font-size: 13px; color: var(--muted);"></p>
    </div>
  </div>

  <script>
    const bootstrap = { wsPath: "__WS_PATH__", cookieName: "__COOKIE_NAME__" };
    const els = {
      msgs: document.getElementById('messages'),
      input: document.getElementById('composerInput'),
      send: document.getElementById('sendBtn'),
      attach: document.getElementById('attachBtn'),
      camera: document.getElementById('cameraBtn'),
      fileInput: document.getElementById('fileInput'),
      photoInput: document.getElementById('photoInput'),
      videoInput: document.getElementById('videoInput'),
      statusDot: document.getElementById('statusDot'),
      headerText: document.getElementById('headerText'),
      initialSystemMessage: document.getElementById('initialSystemMessage'),
      mediaSheet: document.getElementById('mediaSheet'),
      mediaSheetHeader: document.getElementById('mediaSheetHeader'),
      takePhotoBtn: document.getElementById('takePhotoBtn'),
      takePhotoText: document.getElementById('takePhotoText'),
      takePhotoHint: document.getElementById('takePhotoHint'),
      recordVideoBtn: document.getElementById('recordVideoBtn'),
      recordVideoText: document.getElementById('recordVideoText'),
      recordVideoHint: document.getElementById('recordVideoHint'),
      mediaSheetCancel: document.getElementById('mediaSheetCancel'),
      copyToast: document.getElementById('copyToast'),
      approvalGate: document.getElementById('approvalGate'),
      approvalTitle: document.getElementById('approvalTitle'),
      approvalDesc: document.getElementById('approvalDesc')
    };

    const DEVICE_ID_STORAGE_KEY = 'ctxrun-transfer-device-id';
    const state = {
      ws: null,
      deviceId: sessionStorage.getItem(DEVICE_ID_STORAGE_KEY),
      reconnectTimer: null,
      reconnectEnabled: true,
      reconnectAttempts: 0
    };
    const THRESHOLD = 100 * 1024 * 1024;
    const MAX_RECONNECT_DELAY_MS = 10000;
    const MAX_UPLOAD_RESUME_ATTEMPTS = 1;
    const pendingFiles = new Map();
    const queuedUploads = new Map();
    let copyToastTimer = null;
    const language = navigator.language && navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en';
    const messages = {
      en: {
        sessionStarted: 'Session Started',
        attachFile: 'Attach File',
        camera: 'Camera',
        messagePlaceholder: 'Message...',
        send: 'Send',
        waitingApproval: 'Waiting for Approval',
        waitingApprovalDesc: 'Please confirm on your PC to proceed.',
        connectionRejected: 'Connection Rejected',
        connectionRejectedDesc: 'The PC rejected this connection.',
        connect: 'Connect',
        connected: 'Connected',
        disconnected: 'Disconnected',
        download: 'Download',
        waitingForAccept: 'Waiting for PC to accept...',
        rejectedByPc: 'Rejected by PC',
        uploading: 'Uploading...',
        uploadingPercent: 'Uploading {percent}%',
        reconnecting: 'Reconnecting...',
        sent: 'Sent',
        failed: 'Failed',
        cameraSheetTitle: 'Capture',
        takePhoto: 'Take Photo',
        takePhotoHint: 'Open native camera',
        recordVideo: 'Record Video',
        recordVideoHint: 'Capture and send a clip',
        cancel: 'Cancel',
        copy: 'Copy',
        copied: 'Copied',
        copyFailed: 'Copy failed'
      },
      zh: {
        sessionStarted: '会话已开始',
        attachFile: '选择文件',
        camera: '相机',
        messagePlaceholder: '输入消息...',
        send: '发送',
        waitingApproval: '等待确认',
        waitingApprovalDesc: '请在电脑上确认连接请求。',
        connectionRejected: '连接被拒绝',
        connectionRejectedDesc: '电脑端拒绝了此连接。',
        connect: '连接',
        connected: '已连接',
        disconnected: '已断开连接',
        download: '下载',
        waitingForAccept: '等待电脑端接受...',
        rejectedByPc: '已被电脑端拒绝',
        uploading: '上传中...',
        uploadingPercent: '上传中 {percent}%',
        reconnecting: '正在重连...',
        sent: '已发送',
        failed: '失败',
        cameraSheetTitle: '拍摄',
        takePhoto: '拍照',
        takePhotoHint: '调用原生相机',
        recordVideo: '录像',
        recordVideoHint: '拍摄并发送视频片段',
        cancel: '取消',
        copy: '复制',
        copied: '已复制',
        copyFailed: '复制失败'
      }
    };

    function t(key, vars) {
      const dict = messages[language] || messages.en;
      let value = dict[key] || messages.en[key] || key;
      if (vars) {
        Object.keys(vars).forEach((name) => {
          value = value.replace(`{${name}}`, String(vars[name]));
        });
      }
      return value;
    }

    function applyStaticTranslations() {
      document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
      els.initialSystemMessage.textContent = t('sessionStarted');
      els.attach.setAttribute('aria-label', t('attachFile'));
      els.camera.setAttribute('aria-label', t('camera'));
      els.input.placeholder = t('messagePlaceholder');
      els.send.textContent = t('send');
      els.mediaSheetHeader.textContent = t('cameraSheetTitle');
      els.takePhotoText.textContent = t('takePhoto');
      els.takePhotoHint.textContent = t('takePhotoHint');
      els.recordVideoText.textContent = t('recordVideo');
      els.recordVideoHint.textContent = t('recordVideoHint');
      els.mediaSheetCancel.textContent = t('cancel');
    }

    applyStaticTranslations();

    // 输入框自动撑高
    els.input.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
      els.send.disabled = this.value.trim().length === 0;
    });

    function formatTime(ts) {
      return new Date(ts || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      els.msgs.scrollTop = els.msgs.scrollHeight;
    }

    function showToast(text) {
      if (copyToastTimer) {
        clearTimeout(copyToastTimer);
      }
      els.copyToast.textContent = text;
      els.copyToast.classList.remove('hidden');
      copyToastTimer = setTimeout(() => {
        els.copyToast.classList.add('hidden');
        copyToastTimer = null;
      }, 1400);
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const input = document.createElement('textarea');
          input.value = text;
          input.setAttribute('readonly', '');
          input.style.position = 'fixed';
          input.style.opacity = '0';
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
        }
        showToast(t('copied'));
      } catch {
        showToast(t('copyFailed'));
      }
    }

    function openMediaSheet() {
      els.mediaSheet.classList.remove('hidden');
    }

    function closeMediaSheet() {
      els.mediaSheet.classList.add('hidden');
    }

    function readCookie(name) {
      const target = `${name}=`;
      const parts = document.cookie ? document.cookie.split(';') : [];
      for (const part of parts) {
        const normalized = part.trim();
        if (normalized.startsWith(target)) {
          return normalized.slice(target.length);
        }
      }
      return '';
    }

    function storeDeviceId(deviceId) {
      state.deviceId = deviceId || null;
      if (deviceId) {
        sessionStorage.setItem(DEVICE_ID_STORAGE_KEY, deviceId);
      } else {
        sessionStorage.removeItem(DEVICE_ID_STORAGE_KEY);
      }
    }

    function getResumePayload() {
      const sessionToken = readCookie(bootstrap.cookieName);
      const deviceId = state.deviceId || sessionStorage.getItem(DEVICE_ID_STORAGE_KEY);
      if (!deviceId || !sessionToken) return null;
      return { deviceId, sessionToken };
    }

    function queueUploadRetry(fileId, file, attempt) {
      if (!file || attempt > MAX_UPLOAD_RESUME_ATTEMPTS) return false;
      queuedUploads.set(fileId, { file, attempt });
      updateUploadStatus(fileId, t('reconnecting'), '#fcd34d');
      return true;
    }

    function flushQueuedUploads() {
      queuedUploads.forEach((pending, fileId) => {
        queuedUploads.delete(fileId);
        doActualUpload(pending.file, fileId, pending.attempt);
      });
    }

    function scheduleReconnect() {
      clearTimeout(state.reconnectTimer);
      if (!state.reconnectEnabled) return;
      // Mobile browsers throttle background tabs aggressively. Back off harder there to
      // avoid reconnect spin while the file picker or photo app is in the foreground.
      const baseDelayMs = document.hidden ? 1500 : 800;
      const delayMs = Math.min(
        baseDelayMs * Math.pow(2, Math.min(state.reconnectAttempts, 4)),
        MAX_RECONNECT_DELAY_MS
      );
      state.reconnectAttempts += 1;
      state.reconnectTimer = setTimeout(() => {
        state.reconnectTimer = null;
        connect();
      }, delayMs);
    }

    function ensureSocketReady() {
      if (!state.ws || state.ws.readyState === WebSocket.CLOSED || state.ws.readyState === WebSocket.CLOSING) {
        connect();
      }
    }

    function updateUploadStatus(fileId, text, color) {
      const wrapper = document.getElementById(`msg-${fileId}`);
      if (!wrapper) return;
      const stat = wrapper.querySelector('.upload-status');
      if (!stat) return;
      stat.textContent = text;
      stat.style.color = color || '';
    }

    function requestPendingFile(fileId, pending) {
      if (!pending || pending.requestSent || !state.deviceId) return false;
      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return false;
      state.ws.send(JSON.stringify({
        type: 'file_request',
        fileId,
        fileName: pending.file.name,
        fileSize: pending.file.size
      }));
      pending.requestSent = true;
      updateUploadStatus(fileId, t('waitingForAccept'));
      return true;
    }

    function flushPendingFileRequests() {
      pendingFiles.forEach((pending, fileId) => {
        if (!pending.requestSent) {
          requestPendingFile(fileId, pending);
        }
      });
    }

    function appendSysMsg(text) {
      const el = document.createElement('div');
      el.className = 'system-msg';
      el.textContent = text;
      els.msgs.appendChild(el);
      scrollToBottom();
    }

    function appendMsg(text, isOut, ts) {
      const wrapper = document.createElement('div');
      wrapper.className = `bubble-wrapper ${isOut ? 'out' : 'in'}`;
      
      const bubble = document.createElement('div');
      bubble.className = `bubble ${isOut ? 'out' : 'in'}`;
      bubble.textContent = text;
      
      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = formatTime(ts);

      const meta = document.createElement('div');
      meta.className = 'bubble-meta';

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'copy-btn';
      copyBtn.textContent = t('copy');
      copyBtn.onclick = () => { void copyText(text); };

      meta.appendChild(time);
      meta.appendChild(copyBtn);
      wrapper.appendChild(bubble);
      wrapper.appendChild(meta);
      els.msgs.appendChild(wrapper);
      scrollToBottom();
    }

    function appendFile(name, size, url) {
      const wrapper = document.createElement('div');
      wrapper.className = 'bubble-wrapper in';
      const bubble = document.createElement('div');
      bubble.className = 'bubble in';
      
      bubble.innerHTML = `
        <div class="file-card">
          <div class="file-name">${name}</div>
          <div class="file-meta">${(size/1024/1024).toFixed(2)} MB</div>
          <a class="file-dl" href="${url}" download="${name}">${t('download')}</a>
        </div>
      `;
      wrapper.appendChild(bubble);
      els.msgs.appendChild(wrapper);
      scrollToBottom();
    }

    function connect() {
      if (state.ws && (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING)) {
        return;
      }
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      const socket = new WebSocket(`${protocol}://${location.host}${bootstrap.wsPath}`);
      state.ws = socket;

      socket.onopen = () => {
        state.reconnectAttempts = 0;
        els.approvalGate.classList.remove('hidden');
        els.approvalTitle.textContent = t('waitingApproval');
        els.approvalDesc.textContent = t('waitingApprovalDesc');
        sendHello();
      };

      socket.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        switch (msg.type) {
          case 'session':
            storeDeviceId(msg.deviceId);
            document.cookie = `${bootstrap.cookieName}=${msg.sessionToken}; path=/; max-age=3600; SameSite=Strict`;
            els.approvalGate.classList.add('hidden');
            els.statusDot.classList.add('ready');
            els.headerText.textContent = t('connected');
            flushPendingFileRequests();
            flushQueuedUploads();
            break;
          case 'chat': appendMsg(msg.content, false, msg.timestampMs); break;
          case 'file_offer': appendFile(msg.fileName, msg.fileSize, msg.downloadUrl); break;
          case 'file_accept':
            if (msg.fileId && pendingFiles.has(msg.fileId)) {
              const pending = pendingFiles.get(msg.fileId);
              pendingFiles.delete(msg.fileId);
              if (pending) {
                doActualUpload(pending.file, msg.fileId);
              }
            }
            break;
          case 'file_reject':
            if (msg.fileId && pendingFiles.has(msg.fileId)) {
              pendingFiles.delete(msg.fileId);
              const w = document.getElementById(`msg-${msg.fileId}`);
              if (w) {
                const st = w.querySelector('.upload-status');
                if (st) {
                  st.textContent = t('rejectedByPc');
                  st.style.color = 'var(--danger)';
                }
              }
            }
            break;
          case 'error':
            if (msg.message && msg.message.toLowerCase().includes('reject')) {
              state.reconnectEnabled = false;
              els.approvalTitle.textContent = t('connectionRejected');
              els.approvalDesc.textContent = t('connectionRejectedDesc');
            }
            break;
          case 'system': appendSysMsg(msg.content); break;
        }
      };

      socket.onclose = () => {
        const wasCurrentSocket = state.ws === socket;
        if (wasCurrentSocket) {
          state.ws = null;
        }
        els.statusDot.classList.remove('ready');
        els.headerText.textContent = t('disconnected');
        clearTimeout(state.reconnectTimer);
        if (!wasCurrentSocket) {
          return;
        }
        if (state.reconnectEnabled) {
          scheduleReconnect();
        }
      };
    }

    function sendHello() {
      if (!state.ws || state.ws.readyState !== WebSocket.OPEN) return;
      const payload = { type: "hello", userAgent: navigator.userAgent };
      const resume = getResumePayload();
      if (resume) {
        payload.deviceId = resume.deviceId;
        payload.sessionToken = resume.sessionToken;
      }
      state.ws.send(JSON.stringify(payload));
    }

    function handleSend() {
      const val = els.input.value.trim();
      if (!val || !state.ws || state.ws.readyState !== WebSocket.OPEN) return;
      state.ws.send(JSON.stringify({ type: "chat", content: val }));
      appendMsg(val, true);
      els.input.value = '';
      els.input.style.height = 'auto';
      els.send.disabled = true;
    }

    function uploadFile(file) {
      if (!file || !state.deviceId) return;
      
      if (file.size > THRESHOLD) {
        const fileId = Date.now().toString() + Math.random().toString().slice(2);
        const pending = { file, requestSent: false };
        pendingFiles.set(fileId, pending);
        
        const wrapper = document.createElement('div');
        wrapper.className = 'bubble-wrapper out';
        wrapper.id = `msg-${fileId}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble out';
        bubble.innerHTML = `
          <div class="file-card">
            <div class="file-name">${file.name}</div>
            <div class="file-meta upload-status" style="color: #fcd34d;">${t('waitingForAccept')}</div>
          </div>
        `;
        wrapper.appendChild(bubble);
        els.msgs.appendChild(wrapper);
        scrollToBottom();

        if (!requestPendingFile(fileId, pending)) {
          updateUploadStatus(fileId, t('reconnecting'), '#fcd34d');
          ensureSocketReady();
        }
      } else {
        doActualUpload(file, null);
      }
    }

    function doActualUpload(file, fileIdOverride, recoveryAttempt) {
      if (!file || !state.deviceId) return;
      const attempt = recoveryAttempt || 0;
      const fileId = fileIdOverride || (Date.now().toString() + Math.random().toString().slice(2));
      let wrapper = document.getElementById(`msg-${fileId}`);
      let prog;
      let stat;
      
      if (!wrapper) {
        wrapper = document.createElement('div');
        wrapper.className = 'bubble-wrapper out';
        wrapper.id = `msg-${fileId}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble out';
        bubble.innerHTML = `
          <div class="file-card">
            <div class="file-name">${file.name}</div>
            <div class="file-meta upload-status">${t('uploading')}</div>
            <progress max="100" value="0"></progress>
          </div>
        `;
        wrapper.appendChild(bubble);
        els.msgs.appendChild(wrapper);
        scrollToBottom();
        prog = bubble.querySelector('progress');
        stat = bubble.querySelector('.upload-status');
      } else {
        const card = wrapper.querySelector('.file-card');
        if (card && !card.querySelector('progress')) {
          const p = document.createElement('progress');
          p.max = 100;
          p.value = 0;
          card.appendChild(p);
        }
        prog = wrapper.querySelector('progress');
        stat = wrapper.querySelector('.upload-status');
        if (stat) {
          stat.style.color = '';
          stat.textContent = t('uploading');
        }
      }
      
      const fd = new FormData();
      fd.append("file", file);
      const xhr = new XMLHttpRequest();
      xhr.open("POST", `/api/upload/${encodeURIComponent(state.deviceId)}`);
      xhr.setRequestHeader("x-ctxrun-file-size", String(file.size));
      xhr.setRequestHeader("x-ctxrun-file-id", fileId);
      
      xhr.upload.onprogress = e => {
        if (e.lengthComputable && prog) {
          const pct = Math.round((e.loaded / e.total) * 100);
          prog.value = pct;
          if (stat) stat.textContent = t('uploadingPercent', { percent: pct });
        }
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          queuedUploads.delete(fileId);
          if (prog) prog.value = 100;
          if (stat) stat.textContent = t('sent');
        } else {
          if ((xhr.status === 403 || xhr.status === 404) && queueUploadRetry(fileId, file, attempt + 1)) {
            ensureSocketReady();
            return;
          }
          queuedUploads.delete(fileId);
          if (stat) stat.textContent = t('failed');
        }
      };
      xhr.onerror = () => {
        queuedUploads.delete(fileId);
        if (stat) stat.textContent = t('failed');
      };
      xhr.send(fd);
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        ensureSocketReady();
        flushPendingFileRequests();
      }
    });

    window.addEventListener('pageshow', () => {
      ensureSocketReady();
      flushPendingFileRequests();
    });

    els.send.onclick = handleSend;
    els.attach.onclick = () => els.fileInput.click();
    els.camera.onclick = openMediaSheet;
    els.takePhotoBtn.onclick = () => {
      closeMediaSheet();
      els.photoInput.click();
    };
    els.recordVideoBtn.onclick = () => {
      closeMediaSheet();
      els.videoInput.click();
    };
    els.mediaSheetCancel.onclick = closeMediaSheet;
    els.mediaSheet.onclick = (e) => {
      if (e.target === els.mediaSheet) {
        closeMediaSheet();
      }
    };
    els.fileInput.onchange = e => {
      Array.from(e.target.files).forEach(uploadFile);
      els.fileInput.value = '';
    };
    els.photoInput.onchange = e => {
      Array.from(e.target.files).forEach(uploadFile);
      els.photoInput.value = '';
    };
    els.videoInput.onchange = e => {
      Array.from(e.target.files).forEach(uploadFile);
      els.videoInput.value = '';
    };
    connect();
  </script>
</body>
</html>
